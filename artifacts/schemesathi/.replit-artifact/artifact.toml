kind = "web"
previewPath = "/"
title = "SamarthLoan"
description = "A trustworthy public-service platform that helps marginalized entrepreneurs and students discover suitable financial schemes, understand repayment, find channel partners, and track applications using clearly labeled prototype data."
version = "1.0.0"
id = "artifacts/samarthloan"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21401

[services.development]
run = "pnpm --filter @workspace/samarthloan run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/samarthloan", "run", "build" ]
serve = "static"
publicDir = "artifacts/schemesathi/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21401"
BASE_PATH = "/"
